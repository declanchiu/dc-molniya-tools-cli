# .github/workflows/publish.yml

name: Publish to npm

on:
  push:
    branches:
      - main
    paths:
      - 'package.json'

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          registry-url: 'https://registry.npmjs.org/'

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            node_modules
          key: ${{ runner.os }}-npm-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Install dependencies
        run: npm install

      - name: Get local version
        id: local_version
        run: echo "version=$(jq -r .version package.json)" >> $GITHUB_OUTPUT

      - name: Get published version
        id: published_version
        run: |
          PKG_NAME=$(jq -r .name package.json)
          NPM_VERSION=$(npm view $PKG_NAME version || echo "none")
          echo "version=$NPM_VERSION" >> $GITHUB_OUTPUT

      - name: Show versions
        run: |
          echo "Local version: ${{ steps.local_version.outputs.version }}"
          echo "Published version: ${{ steps.published_version.outputs.version }}"

      - name: Build project
        if: steps.local_version.outputs.version != steps.published_version.outputs.version
        run: npm run build

      - name: Publish to npm
        if: steps.local_version.outputs.version != steps.published_version.outputs.version
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}